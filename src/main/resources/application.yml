spring:
  application:
    name: javachat

  # Locally, values come from the .env file in the project root.
  # In Docker, docker compose passes them in as environment variables.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:javachat}
    username: ${DB_USER:javachat}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only checks it
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Every error response uses RFC 9457 problem details (JSON), never a Whitelabel page
  mvc:
    problemdetails:
      enabled: true
    # Streaming replies are async requests; allow long answers to finish
    async:
      request-timeout: 2m

  # Login with Google. Spring already knows Google's endpoints,
  # so only the client credentials and the requested scopes are needed.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

  ai:
    # Which model implementation backs ChatModel / EmbeddingModel.
    # The OpenAI starter also talks to Azure OpenAI (Microsoft Foundry).
    model:
      chat: openai
      embedding: openai
      # Not used by this app, so don't create them
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

    openai:
      base-url: ${AZURE_OPENAI_ENDPOINT}
      api-key: ${AZURE_OPENAI_API_KEY}
      microsoft-foundry: true
      chat:
        options:
          # On Azure this is the deployment name (by default the same as the model name)
          model: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4.1-mini}
          max-completion-tokens: 1024
      embedding:
        options:
          model: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
          dimensions: 1536

    vectorstore:
      pgvector:
        dimensions: 1536          # text-embedding-3-small size
        distance-type: cosine-distance
        index-type: hnsw
        initialize-schema: false  # the table will come from a Flyway migration

server:
  port: ${SERVER_PORT:8080}
  # Running behind your reverse proxy: trust its X-Forwarded-* headers
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

# OpenAPI description and Swagger UI (both require login)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
