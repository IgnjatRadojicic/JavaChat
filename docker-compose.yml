services:
  db:
    build: ./docker/postgres
    image: javachat-postgres:18-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-javachat}
      POSTGRES_USER: ${DB_USER:-javachat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Only reachable from this machine (for local dev / DB tools)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: javachat-app
    restart: unless-stopped
    profiles: ["app"]   # start with: docker compose --profile app up -d
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db       # inside Docker, the database is reached by service name
      DB_PORT: 5432
      SERVER_PORT: 8080 # fixed inside the container; the host side uses SERVER_PORT from .env
    ports:
      # Your reverse proxy forwards to this; not exposed to the outside directly
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
